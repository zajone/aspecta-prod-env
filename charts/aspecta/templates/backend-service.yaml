{{- $component := "backend" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aspecta.componentName" (dict "root" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aspecta.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  # ClusterIP only: the backend is never published directly, all external
  # traffic arrives through the Ingress and the frontend.
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
    - name: http-ops
      port: {{ .Values.backend.service.opsPort }}
      targetPort: http-ops
      protocol: TCP
  selector:
    {{- include "aspecta.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
