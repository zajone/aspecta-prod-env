{{- range $component, $spec := dict "backend" .Values.backend "frontend" .Values.frontend }}
{{- if $spec.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aspecta.componentName" (dict "root" $ "component" $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "aspecta.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aspecta.componentName" (dict "root" $ "component" $component) }}
  minReplicas: {{ $spec.autoscaling.minReplicas }}
  maxReplicas: {{ $spec.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $spec.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      # React quickly to a traffic spike.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Scale in slowly: a five-minute window prevents the autoscaler from
      # flapping around a fluctuating load pattern.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
{{- end }}
