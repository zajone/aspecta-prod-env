apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aspecta.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aspecta.labels" . | nindent 4 }}
data:
  # Backend runtime configuration.
  APP_BANNER: {{ .Values.config.banner | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  PAGE_SIZE_DEFAULT: {{ .Values.config.pageSizeDefault | quote }}
  PAGE_SIZE_MAX: {{ .Values.config.pageSizeMax | quote }}
  FEATURE_SEARCH: {{ .Values.config.featureSearch | quote }}
  ALERT_BUFFER_SIZE: {{ .Values.config.alertBufferSize | quote }}
  DRAIN_DELAY: {{ .Values.config.drainDelay | quote }}
  SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | quote }}
  # Frontend runtime configuration: the API upstream nginx proxies to.
  BACKEND_ADDR: {{ printf "%s:%d" (include "aspecta.componentName" (dict "root" . "component" "backend")) (int .Values.backend.service.port) | quote }}
