{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aspecta.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aspecta.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither workload talks to the Kubernetes API, so no token is projected into
# the pods. A stolen container therefore has no cluster credential at all.
automountServiceAccountToken: false
{{- end }}
