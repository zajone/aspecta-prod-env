{{- $component := "frontend" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aspecta.componentName" (dict "root" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aspecta.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aspecta.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
