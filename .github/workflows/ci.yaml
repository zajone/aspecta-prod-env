name: ci

# The delivery pipeline. On a push to main it builds both images, publishes them
# to GHCR and then updates the Helm chart to point at the new version - which is
# the change Argo CD reacts to. The pipeline never talks to a cluster; git is
# the only interface between CI and the environment.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/pr.yaml"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  # Never let two release runs race for the same chart bump commit.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  validate:
    name: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.ns.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # No credential left in .git/config: this job only reads the
        # repository, and a token that outlives the checkout step is
        # readable by every later step, including module code that
        # `go build` executes.
        with:
          persist-credentials: false

      # GHCR rejects an uppercase path and github.repository_owner is verbatim,
      # so a fork under an owner like "Zajone" failed the push with "repository
      # name must be lowercase" - the opposite of the "a fork deploys itself
      # with no edits" claim this repository makes. Resolved once here, like
      # the version below, so both jobs use the same string.
      - name: resolve the registry namespace
        id: ns
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: resolve the next version
        id: version
        # Resolved once, here, rather than inside the build matrix: a matrix job
        # has no single output, and both legs must publish the same tag.
        run: |
          set -euo pipefail
          current="$(grep '^appVersion:' charts/aspecta/Chart.yaml | sed 's/.*"\(.*\)".*/\1/')"
          IFS=. read -r major minor patch <<< "${current}"
          case "${{ inputs.bump || 'patch' }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${current} -> ${major}.${minor}.${patch}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: gofmt
        working-directory: apps/backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::these files are not gofmt-clean: ${unformatted}"
            exit 1
          fi

      - name: go vet
        working-directory: apps/backend
        run: go vet ./...

      - name: go test
        working-directory: apps/backend
        run: go test ./... -race -cover -coverprofile=coverage.out

      - name: coverage summary
        working-directory: apps/backend
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: install tooling
        run: scripts/install-tools.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning scripts/*.sh

      - name: helm lint, render and schema-validate
        run: scripts/lint.sh

  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.component }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by the attestation step below.
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # No credential left in .git/config: this job only reads the
        # repository, and a token that outlives the checkout step is
        # readable by every later step, including module code that
        # `go build` executes.
        with:
          persist-credentials: false

      - name: require a resolved version
        # Without this, an empty version silently produces an image tagged
        # "repo:" and buildx fails with an error that says nothing about why.
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "::error::the validate job did not publish a version"
            exit 1
          fi
          echo "building version ${VERSION}"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The automatic token is enough to publish to this repository's
          # package namespace; no long-lived registry credential is stored.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan before anything is published. Built for one platform and loaded
      # into the local daemon, so a HIGH/CRITICAL finding fails the job while
      # the image exists nowhere but this runner. The multi-arch push below
      # then reuses these layers from the cache, so the second build is cheap.
      - name: build for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/${{ matrix.component }}
          file: apps/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ github.sha }}
          tags: aspecta-${{ matrix.component }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: scan the image before it is published
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aspecta-${{ matrix.component }}:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/${{ matrix.component }}
          file: apps/${{ matrix.component }}/Dockerfile
          # arm64 is built as well so the same images run on an Apple silicon
          # laptop, not only on an x86 CI runner.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.validate.outputs.owner }}/aspecta-${{ matrix.component }}:${{ needs.validate.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.validate.outputs.owner }}/aspecta-${{ matrix.component }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.validate.outputs.owner }}/aspecta-${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: attest the build provenance
        # Signs a statement that this digest was produced by this workflow from
        # this commit, so the image can be traced back without trusting a tag.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.validate.outputs.owner }}/aspecta-${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true


  # ---------------------------------------------------------------------------
  release-chart:
    name: package and release the chart
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A real token would be needed to trigger further workflows from this
          # push; the default token deliberately does not, which is what
          # prevents this commit from starting the pipeline again.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: install tooling
        run: scripts/install-tools.sh

      - name: bump the chart
        id: bump
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          chart=charts/aspecta/Chart.yaml

          # The chart version tracks the packaging; appVersion tracks the code
          # and is what the templates use as the default image tag.
          old_chart_version="$(yq '.version' "${chart}")"
          new_chart_version="$(yq -r '.version | split(".") | .[0] + "." + .[1] + "." + ((.[2] | tonumber + 1) | tostring)' "${chart}")"

          yq -i ".version = \"${new_chart_version}\" | .appVersion = \"${VERSION}\"" "${chart}"

          echo "chart_version=${new_chart_version}" >> "$GITHUB_OUTPUT"
          {
            echo "### Released"
            echo "- images: \`aspecta-backend\` and \`aspecta-frontend\` at \`${VERSION}\`"
            echo "- chart: \`${old_chart_version}\` to \`${new_chart_version}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: verify the chart still renders with the new version
        run: |
          helm lint charts/aspecta
          helm template aspecta charts/aspecta | grep -q "aspecta-backend:${{ needs.validate.outputs.version }}"

      - name: package and publish the chart to GHCR
        run: |
          # The chart is published as an OCI artifact next to the images it
          # deploys, so a release is one coordinate: version + registry.
          helm package charts/aspecta --destination /tmp/chart
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart/aspecta-${{ steps.bump.outputs.chart_version }}.tgz" \
            "oci://ghcr.io/${{ needs.validate.outputs.owner }}/charts"

      - name: commit the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/aspecta/Chart.yaml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # This commit is the deployment trigger: Argo CD is watching this
          # branch and rolls the new image out on its own.
          git commit -m "release: aspecta ${{ needs.validate.outputs.version }} (chart ${{ steps.bump.outputs.chart_version }})" \
                     -m "Images published to ghcr.io/${{ needs.validate.outputs.owner }}. Argo CD picks this commit up and rolls the deployment." \
                     -m "[skip ci]"
          git push

      - name: tag the release
        run: |
          git tag -a "v${{ needs.validate.outputs.version }}" \
            -m "aspecta ${{ needs.validate.outputs.version }}"
          git push origin "v${{ needs.validate.outputs.version }}"
